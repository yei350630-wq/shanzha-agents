<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地球Online · Agent 版 · 山楂的 Life OS</title>
<style>
  :root{
    --ink:#2B2419; --ink2:#5C4F3D; --ink3:#9A8C74;
    --teal:#0D9488; --teal-d:#0F766E; --teal-l:#CCFBF1;
    --indigo:#4F46E5; --amber:#F59E0B; --amber-d:#B45309;
    --cream:#FFFBF2; --cream-line:#EADFCB; --outline:#2B2419;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(900px 520px at 12% 0%,rgba(13,148,136,.10),transparent 62%),
      radial-gradient(760px 480px at 92% 100%,rgba(79,70,229,.09),transparent 60%),
      linear-gradient(160deg,#FFFDF8 0%,#F3FBF9 40%,#F0F4FF 72%,#FFFBF2 100%);
    display:flex;align-items:center;justify-content:center;
    min-height:100%;padding:0;overflow-x:hidden;
  }

  .stage{
    position:relative;
    width:min(100vw,150vh);
    aspect-ratio:3/2;
    container-type:inline-size;
    background:var(--cream);
    overflow:hidden;
    box-shadow:0 24px 70px rgba(43,36,25,.18);
  }

  /* ---------- 插画底图 ---------- */
  .art{
    position:absolute;inset:0;
    background:url("assets/earth-online-cover.jpg") center center / 100% 100% no-repeat;
  }

  /* ---------- 木牌上的标题 ---------- */
  .logo{
    position:absolute;
    left:7%; top:45.5%; width:34%;
    text-align:center;
    display:flex;flex-direction:column;align-items:center;
  }
  .kick{
    font-size:1.12cqw;font-weight:800;letter-spacing:.26em;
    color:var(--amber-d);margin-bottom:.85cqw;padding-left:.26em;
  }
  .row{display:flex;align-items:center;justify-content:center;gap:1.3cqw}
  .zh{
    font-size:5.35cqw;font-weight:900;line-height:1;letter-spacing:.02em;
    color:var(--teal-d);
    text-shadow:
      -.24cqw 0 0 var(--outline), .24cqw 0 0 var(--outline),
      0 -.24cqw 0 var(--outline), 0 .24cqw 0 var(--outline),
      -.17cqw -.17cqw 0 var(--outline), .17cqw -.17cqw 0 var(--outline),
      -.17cqw .17cqw 0 var(--outline), .17cqw .17cqw 0 var(--outline),
      0 .55cqw 0 rgba(43,36,25,.20);
  }
  .tag{
    font-size:1.62cqw;font-weight:800;white-space:nowrap;
    color:#FFFDF8;background:var(--amber);
    border:.22cqw solid var(--outline);border-radius:.85cqw;
    padding:.52cqw 1cqw;
    transform:rotate(-6deg);
    box-shadow:0 .32cqw 0 rgba(43,36,25,.22);
    margin-top:-1.15cqw;
  }
  .en{
    font-size:4.55cqw;font-weight:900;font-style:italic;line-height:1.12;
    letter-spacing:-.01em;color:var(--indigo);margin-top:.3cqw;
    text-shadow:
      -.22cqw 0 0 var(--outline), .22cqw 0 0 var(--outline),
      0 -.22cqw 0 var(--outline), 0 .22cqw 0 var(--outline),
      -.16cqw -.16cqw 0 var(--outline), .16cqw -.16cqw 0 var(--outline),
      -.16cqw .16cqw 0 var(--outline), .16cqw .16cqw 0 var(--outline),
      0 .5cqw 0 rgba(43,36,25,.18);
  }

  /* ---------- 黄色按钮（对齐插画里那块琥珀色牌子：x 22.9–42.4% / y 74.1–86.2%） ---------- */
  .cta{
    position:absolute;
    left:23.3%; top:74.2%; width:19.2%; height:11.8%;
    display:flex;align-items:center;justify-content:center;gap:1cqw;
    text-decoration:none;color:#3A2E22;
    transition:transform .16s ease;
  }
  .cta:hover{transform:translateY(-.4cqw)}
  .cta:active{transform:translateY(0)}
  .cta .ic{flex:0 0 auto;width:2.5cqw;height:2.5cqw;display:block}
  .cta .txt{text-align:left;line-height:1.16}
  .cta .t1{display:block;font-size:1.95cqw;font-weight:900;letter-spacing:.04em}
  .cta .t2{display:block;font-size:1.06cqw;font-weight:800;color:#7A5406;margin-top:.18cqw}

  /* ---------- 右下角署名（同时压住平台生图标记） ---------- */
  .credit{
    position:absolute;right:.4%; bottom:.5%;
    display:flex;align-items:center;gap:.55cqw;
    height:7%; padding:0 1.2%;
    background:#FFFBF2;
    border:1px solid rgba(43,36,25,.14);
    border-radius:999px;
    box-shadow:0 .25cqw 1cqw rgba(43,36,25,.15);
    font-size:1.02cqw;font-weight:800;letter-spacing:.06em;color:#6B5B42;
    white-space:nowrap;
  }
  .credit i{
    width:.62cqw;height:.62cqw;border-radius:999px;background:var(--teal);
    display:block;flex:0 0 auto;
  }

  /* ---------- 窄屏：图在上，文字竖排到下面 ---------- */
  @media (max-aspect-ratio:1/1), (max-width:760px){
    body{display:flex;flex-direction:column;min-height:100vh;padding:0}
    .stage{
      flex:1;width:100vw;aspect-ratio:auto;min-height:0;
      display:flex;flex-direction:column;
      box-shadow:none;background:transparent;overflow:visible;
    }
    .art{
      position:relative;inset:auto;
      width:100%;aspect-ratio:3/2;
      border-radius:0 0 22px 22px;
      box-shadow:0 14px 40px rgba(43,36,25,.16);
      flex:0 0 auto;
    }
    .logo{position:static;width:auto;margin:auto 6vw 0;gap:0}
    .kick{font-size:2.9vw;margin-bottom:2.4vw}
    .row{gap:3vw}
    .zh{font-size:13.5vw;text-shadow:
      -.55vw 0 0 var(--outline), .55vw 0 0 var(--outline),
      0 -.55vw 0 var(--outline), 0 .55vw 0 var(--outline),
      -.4vw -.4vw 0 var(--outline), .4vw -.4vw 0 var(--outline),
      -.4vw .4vw 0 var(--outline), .4vw .4vw 0 var(--outline),
      0 1.2vw 0 rgba(43,36,25,.20)}
    .tag{font-size:4vw;border:.5vw solid var(--outline);border-radius:2vw;
      padding:1.2vw 2.4vw;box-shadow:0 .8vw 0 rgba(43,36,25,.22);margin-top:-2.6vw}
    .en{font-size:11.5vw;margin-top:1vw;text-shadow:
      -.5vw 0 0 var(--outline), .5vw 0 0 var(--outline),
      0 -.5vw 0 var(--outline), 0 .5vw 0 var(--outline),
      -.36vw -.36vw 0 var(--outline), .36vw -.36vw 0 var(--outline),
      -.36vw .36vw 0 var(--outline), .36vw .36vw 0 var(--outline),
      0 1.1vw 0 rgba(43,36,25,.18)}

    .cta{
      position:static;width:auto;height:auto;
      margin:6vw 6vw auto;padding:4.6vw 6vw;gap:2.6vw;
      background:linear-gradient(180deg,#FBBF24,#F59E0B);
      border:3px solid var(--outline);border-radius:18px;
      box-shadow:0 6px 0 rgba(43,36,25,.22);
      justify-content:center;
    }
    .cta:hover{transform:none}
    .cta .ic{width:9vw;height:9vw}
    .cta .t1{font-size:5.4vw}
    .cta .t2{font-size:3.2vw;margin-top:.8vw}
    .credit{
      position:absolute;right:.7%;bottom:.7%;
      height:auto;padding:1.6vw 3vw;gap:1.6vw;
      font-size:2.8vw;border-radius:999px;box-shadow:0 2px 8px rgba(43,36,25,.16);
    }
    .credit i{width:1.8vw;height:1.8vw}
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="art">
      <div class="credit"><i></i>山楂 · 个人 Agent 系统 · 2026</div>
    </div>

    <div class="logo">
      <div class="kick">EARTH ONLINE · AGENT ROSTER</div>
      <div class="row">
        <span class="zh">地球</span>
        <span class="tag">Agent 版</span>
      </div>
      <span class="en">Online</span>
    </div>

    <a class="cta" href="earth-online.html">
      <svg class="ic" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="10" fill="#0D9488" stroke="#2B2419" stroke-width="1.6"/>
        <path d="M2.2 12h19.6" stroke="#FFFBF2" stroke-width="1.3" opacity=".85"/>
        <path d="M12 2.2c2.9 2.6 4.4 6 4.4 9.8S14.9 19.2 12 21.8C9.1 19.2 7.6 15.8 7.6 12S9.1 4.8 12 2.2Z"
              stroke="#FFFBF2" stroke-width="1.3" opacity=".85"/>
        <path d="M4.6 6.6c2.2 1.5 4.7 2.3 7.4 2.3s5.2-.8 7.4-2.3" stroke="#FFFBF2" stroke-width="1.2" opacity=".7"/>
        <path d="M4.6 17.4c2.2-1.5 4.7-2.3 7.4-2.3s5.2.8 7.4 2.3" stroke="#FFFBF2" stroke-width="1.2" opacity=".7"/>
      </svg>
      <span class="txt">
        <span class="t1">点击进入</span>
        <span class="t2">我的 Agent 队伍 · 10 个角色</span>
      </span>
    </a>
  </div>

</body>
</html>
